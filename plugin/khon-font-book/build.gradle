plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'dev.tungwenblog.khonfontbook'

repositories {
    mavenCentral()
}

sourceSets {
    parser { java.srcDir 'src/parser/java' }
}

dependencies {
    parserImplementation 'org.apache.pdfbox:fontbox:2.0.34'
    parserImplementation 'commons-logging:commons-logging:1.3.5'
}

tasks.register('parserJar', Jar) {
    archiveFileName = 'font-worker.jar'
    destinationDirectory = layout.buildDirectory.dir('parser')
    manifest { attributes('Main-Class': 'dev.tungwenblog.khonfontbook.parser.MetadataWorker') }
    from sourceSets.parser.output
    from('LICENSE')
    from('NOTICE')
    from({ configurations.parserRuntimeClasspath.collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA',
            'org/apache/fontbox/ttf/CmapSubtable.class', 'LICENSE*', 'NOTICE*', 'META-INF/LICENSE*', 'META-INF/NOTICE*'
    }
    configurations.parserRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
        from(zipTree(artifact.file)) {
            include 'LICENSE*', 'NOTICE*', 'META-INF/LICENSE*', 'META-INF/NOTICE*'
            into "META-INF/licenses/${artifact.moduleVersion.id.group}.${artifact.name}-${artifact.moduleVersion.id.version}"
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('parserChecksums') {
    dependsOn tasks.named('parserJar')
    inputs.file tasks.named('parserJar').flatMap { it.archiveFile }
    inputs.file 'src/main/resources/parser/linux-x86_64/decoder'
    outputs.file layout.buildDirectory.file('parser/checksums.properties')
    doLast {
        def digest = { File input -> java.security.MessageDigest.getInstance('SHA-256').digest(input.bytes).encodeHex().toString() }
        layout.buildDirectory.file('parser/checksums.properties').get().asFile.text =
            "font-worker.jar=${digest(tasks.named('parserJar').get().archiveFile.get().asFile)}\n" +
            "linux-x86_64/decoder=${digest(file('src/main/resources/parser/linux-x86_64/decoder'))}\n"
    }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    compileOnly 'run.halo.app:api'
    implementation('com.helger:ph-css:8.2.3') {
        // Halo supplies SLF4J; a private API copy cannot use its Logback provider.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.27.0'
    port = 8091
}

haloPlugin {
    openApi {
        groupingRules {
            extensionApis {
                displayName = 'KhonFontBook APIs'
                pathsToMatch = ['/apis/font-book.tungwenblog.dev/v1alpha1/**',
                    '/apis/console.api.font-book.tungwenblog.dev/v1alpha1/**',
                    '/apis/api.font-book.tungwenblog.dev/v1alpha1/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/extensionApis': 'extensionApis.json']
        generator { outputDir = file("${projectDir}/ui/src/api/generated") }
    }
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

configurations {
    releaseSources { transitive = false }
}
dependencies {
    releaseSources 'org.apache.pdfbox:fontbox:2.0.34:sources'
    releaseSources 'commons-logging:commons-logging:1.3.5:sources'
}

def releaseRuntimeArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
releaseRuntimeArtifacts.each { artifact ->
    dependencies.add('releaseSources', "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}:sources")
}

tasks.named('processResources') {
    dependsOn tasks.named('parserChecksums')
    exclude 'fontmeta.py'
    from(tasks.named('parserJar')) { into 'parser' }
    from(layout.buildDirectory.file('parser/checksums.properties')) { into 'parser' }
    from('LICENSE')
    from('NOTICE')
    from('THIRD_PARTY_NOTICES.md')
    // Keep dependency legal files distinct when the plugin JAR merges them.
    releaseRuntimeArtifacts.each { artifact ->
        from(zipTree(artifact.file)) {
            include 'LICENSE', 'LICENSE.*', 'NOTICE', 'NOTICE.*',
                'META-INF/LICENSE*', 'META-INF/NOTICE*'
            into "META-INF/licenses/${artifact.moduleVersion.id.group}.${artifact.name}-${artifact.moduleVersion.id.version}"
        }
    }
}

tasks.register('sourceBundle', Zip) {
    group = 'distribution'
    description = 'Package corresponding source and public documents without local data or caches'
    mustRunAfter project(':ui').tasks.named('pnpmInstall')
    archiveFileName = "${rootProject.name}-${project.version}-sources.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(configurations.releaseSources) { into 'third-party-sources' }
    from(projectDir) {
        into 'plugin/khon-font-book'
        include 'src/**', 'ui/src/**', 'ui/env.d.ts', 'ui/*.json', 'ui/*.ts',
            'ui/*.yaml', 'ui/*.gradle', 'ui/*.cjs', 'ui/*.js',
            'gradle/wrapper/**', 'gradlew', 'gradlew.bat', '*.gradle',
            'gradle.properties', '.gitignore', 'LICENSE', 'NOTICE',
            'THIRD_PARTY_NOTICES.md', 'README.md'
        exclude 'src/main/resources/ui/**'
    }
    from(rootProject.file('../../docs/plugin/khon-font-book')) {
        into 'docs/plugin/khon-font-book'
        include 'release/guides/app-store-listing.md', 'release/guides/privacy.md',
            'release/guides/release-notes.md', 'release/guides/build.md'
    }
}
